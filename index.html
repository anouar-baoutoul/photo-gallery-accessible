
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Galerie photo interactive accessible</title>
  <meta name="description" content="Galerie photo accessible et interactive pour projet web">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Galerie Photo Accessible</h1>
    <h2>Projet final – Web interactif et accessibilité</h2>
  </header>
  <main>
    <section id="gallery">
      <figure>
        <img src="images/image1.jpg" alt="Ville nocturne vue aérienne" />
        <figcaption>Ville nocturne</figcaption>
      </figure>
      <figure>
        <img src="images/image2.jpg" alt="Forêt de sapins sous la neige" />
        <figcaption>Forêt enneigée</figcaption>
      </figure>
      <figure>
        <img src="images/image3.jpg" alt="Plage au coucher du soleil" />
        <figcaption>Plage au coucher</figcaption>
      </figure>
      <figure>
        <img src="images/image4.jpg" alt="Montagne au lever du jour" />
        <figcaption>Montagne matin</figcaption>
      </figure>
      <figure>
        <img src="images/image5.jpg" alt="Fleurs de printemps en gros plan" />
        <figcaption>Fleurs macro</figcaption>
      </figure>
      <figure>
        <img src="images/image6.jpg" alt="Désert, dunes dorées" />
        <figcaption>Dunes désertiques</figcaption>
      </figure>
    </section>
  </main>
  <script>
    function addTabFocus() {
      const figures = document.querySelectorAll('#gallery figure');
      for (let i = 0; i < figures.length; i++) {
        figures[i].setAttribute('tabindex', '0');
        figures[i].addEventListener('focus', function() {
          console.log('Focus on figure ' + (i+1));
        });
        figures[i].addEventListener('blur', function() {
          console.log('Blur on figure ' + (i+1));
        });
        figures[i].addEventListener('mouseover', function() {
          console.log('Mouse over figure ' + (i+1));
        });
        figures[i].addEventListener('mouseleave', function() {
          console.log('Mouse left figure ' + (i+1));
        });
      }
      console.log('addTabFocus : tabindex et events ajoutés !');
    }
    window.onload = addTabFocus;
  </script>
</body>
</html>
